[project]
name = "sentinel"
version = "0.1.0"
description = "MCP gateway that limits AI agents to the task they were given"
readme = "README.md"
authors = [
    { name = "Navdeep Singh Dhunna", email = "navdeep.s.dhunna@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "cryptography>=50.0.2",
    "fastmcp>=4.1.3",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
sentinel = "sentinel:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
