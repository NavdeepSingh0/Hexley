<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Shadow -->
  <ellipse cx="100" cy="176" rx="58" ry="8" fill="#000" opacity=".28"/>
  <!-- Body shell: white-to-grey gradient approximated with a fill -->
  <rect x="30" y="36" width="140" height="128" rx="40" fill="#DCDCE8" stroke="rgba(0,0,0,0.14)" stroke-width="1"/>
  <!-- Dome shine -->
  <ellipse cx="86" cy="50" rx="34" ry="8" fill="#fff" opacity=".8"/>
  <!-- Screen -->
  <rect x="48" y="62" width="104" height="72" rx="20" fill="#07070A"/>
  <!-- Grid lines (subtle) -->
  <g stroke="#fff" stroke-opacity=".07" stroke-width="1">
    <path d="M65 64v68"/><path d="M77.3 64v68"/><path d="M89.6 64v68"/>
    <path d="M101.9 64v68"/><path d="M114.2 64v68"/><path d="M126.5 64v68"/><path d="M138.8 64v68"/>
    <path d="M50 79.5h100"/><path d="M50 94.5h100"/><path d="M50 109.5h100"/><path d="M50 124.5h100"/>
  </g>
  <!-- Eyes (idle: white vertical bars) -->
  <path d="M78,84 L78,98 L78,112" fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M122,84 L122,98 L122,112" fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Badge tile -->
  <rect x="126" y="140" width="28" height="18" rx="6" fill="#07070A"/>
  <!-- Badge dot (violet) -->
  <circle cx="140" cy="149" r="4" fill="#A98BFF"/>
  <!-- Vent -->
  <rect x="52" y="146" width="22" height="4" rx="2" fill="#9A9AB0" opacity=".6"/>
</svg>

