<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sentinel overlay</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --violet:    #A98BFF;
      --green:     #34E8A3;
      --blue:      #5B9BFF;
      --amber:     #FFB62E;
      --red:       #FF5468;
      --ink:       #07070A;
      --surface:   #16161F;
      --surface2:  #1E1E2A;
      --border:    rgba(255,255,255,0.08);
      --text:      #FFFFFF;
      --text-muted:#A9A9BC;
      --font:      "Helvetica Neue", Helvetica, Arial, sans-serif;
      --radius:    14px;
    }

    [data-theme="light"] {
      --surface:   #FFFFFF;
      --surface2:  #F4F3FA;
      --border:    rgba(0,0,0,0.08);
      --text:      #07070A;
      --text-muted:#6B6B7E;
    }

    html, body {
      width: 260px;
      height: 260px;
      background: transparent !important;
      -webkit-background-clip: content-box;
      overflow: visible;
      font-family: var(--font);
    }

    /* ── Root wrap — anchored bottom-left ─────────────────────────────────── */
    #wrap {
      position: absolute;
      bottom: 0;
      left: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    /* ── Minimised dot ────────────────────────────────── */
    /* ── Mascot wrapper ───────────────────────────────── */
    #mascot-wrap {
      position: relative;
      width: 80px;
      height: 80px;
    }

    sentinel-mascot {
      display: block;
      overflow: visible;
    }

    /* ── Motion that survives a small size ──────────────────────────────────────────────────────────────────────────
       The mascot's own motion is drawn in a 200-unit box, so at 80 px its bob is about one pixel and looks still on a busy
       page. This wrapper adds movement a person can see: a slow float while it waits (faster while it checks), and a pop or
       a shake each time the state changes. It decides nothing and shows no state of its own; it is switched off for anyone
       whose system asks for reduced motion. */
    #mascot-wrap { animation: float 3.4s ease-in-out infinite; }
    #mascot-wrap[data-state="checking"], #mascot-wrap[data-state="needs-approval"] { animation-duration: 1.2s; }
    #mascot-wrap[data-state="sleeping"] { animation-duration: 5.5s; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    sentinel-mascot.fx-pop { animation: pop .55s cubic-bezier(.3, 1.5, .5, 1); transform-origin: 50% 100%; }
    sentinel-mascot.fx-shake { animation: shake .5s ease-in-out; transform-origin: 50% 100%; }
    @keyframes pop { 0% { transform: scale(1); } 35% { transform: scale(1.18) rotate(-3deg); } 70% { transform: scale(.95); } 100% { transform: scale(1); } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-6px) rotate(-2deg); } 40% { transform: translateX(6px) rotate(2deg); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
    @media (prefers-reduced-motion: reduce) {
      #mascot-wrap, sentinel-mascot.fx-pop, sentinel-mascot.fx-shake { animation: none !important; }
    }

    /* ── Connection pill ──────────────────────────────── */
    #pill {
      margin-top: 4px;
      padding: 4px 10px;
      border-radius: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      max-width: 220px;
    }
    #pill[data-ok="1"] {
      color: var(--green);
      border-color: var(--green);
    }

    /* ── Review button ────────────────────────────────── */
    #review-btn {
      margin-top: 6px;
      padding: 6px 14px;
      border-radius: 8px;
      background: var(--amber);
      border: none;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink);
      font-family: var(--font);
    }
    #review-btn:hover { opacity: .85; }

    /* ── Approval panel ───────────────────────────────── */
    #approval-panel {
      margin-top: 8px;
      width: 220px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      font-size: 12px;
      color: var(--text);
    }

    #approval-panel h3 {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--amber);
      margin-bottom: 6px;
    }

    #approval-tool {
      font-weight: 700;
      margin-bottom: 2px;
    }

    #approval-summary {
      color: var(--text-muted);
      margin-bottom: 6px;
      line-height: 1.4;
    }

    #approval-args-wrap {
      background: var(--surface2);
      border-radius: 6px;
      padding: 6px 8px;
      margin-bottom: 6px;
    }

    #approval-args {
      font-family: monospace;
      font-size: 10px;
      color: var(--text-muted);
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 60px;
      overflow-y: auto;
    }

    #approval-timer {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .approval-actions {
      display: flex;
      gap: 6px;
    }

    .approval-actions button {
      flex: 1;
      padding: 6px 0;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-family: var(--font);
      font-size: 12px;
      font-weight: 600;
    }

    #approve-btn {
      background: var(--green);
      color: var(--ink);
    }
    #approve-btn:hover { opacity: .85; }
    #approve-btn:disabled { opacity: .4; cursor: default; }

    #deny-btn {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    #deny-btn:hover { background: var(--red); color: #fff; border-color: var(--red); }
    #deny-btn:disabled { opacity: .4; cursor: default; }
  </style>
</head>
<body>
  <!-- Main overlay wrap -->
  <div id="wrap">
    <div id="mascot-wrap">
      <!-- size="80": viewBox 0 0 200 200, scale = 80/200 = 0.4
           overflow:visible on the SVG means speech bubbles show outside the box -->
      <sentinel-mascot
        id="mascot"
        state="sleeping"
        size="80"
        placement="above"
        theme="dark"
      ></sentinel-mascot>
    </div>

    <!-- Connection status pill -->
    <div id="pill" role="status" aria-live="polite">
      <span id="pill-text">Loading…</span>
    </div>

    <!-- Review button (shown when needs-approval) -->
    <button id="review-btn" hidden aria-label="Review held action">⚠ Review</button>

    <!-- Approval panel -->
    <section id="approval-panel" hidden aria-label="Pending approval">
      <h3>Needs approval</h3>
      <div id="approval-tool"></div>
      <div id="approval-summary"></div>
      <div id="approval-args-wrap">
        <pre id="approval-args"></pre>
      </div>
      <div id="approval-timer" aria-live="polite"></div>
      <div class="approval-actions">
        <button id="approve-btn">Approve</button>
        <button id="deny-btn">Deny</button>
      </div>
    </section>
  </div>

  <!-- The mascot Web Component — copied from design/mascot/ -->
  <script type="module" src="sentinel-mascot.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
