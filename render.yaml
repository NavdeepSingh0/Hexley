# Render Blueprint (plan D1; docs/DEPLOY.md). In Render: New, then Blueprint, then choose this repository.
# The values marked `sync: false` are asked for in Render's dashboard and are never stored in git.
services:
  - type: web
    name: sentinel
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      # A token you choose: at least 24 characters, letters, digits, - and _ only. Anyone who has it can use the console and chat.
      - key: SENTINEL_API_TOKEN
        sync: false
      # The hosted model's key (build.nvidia.com). More keys can be added in the dashboard later as NVIDIA_API_KEY_2, _3 ...: a
      # rate limit on one key then moves the chat to the next.
      - key: NVIDIA_API_KEY
        sync: false
      # The most requests the hosted model may be sent by this deployment in total (retries count). Restarting resets it.
      - key: SENTINEL_LIVE_MODEL_CAP
        value: "300"
      # The public address. It turns on sign-in for AI clients; the connector address is this followed by /mcp.
      - key: SENTINEL_PUBLIC_URL
        value: https://hexley.site
      # Connector credentials (D-052). A connector whose variable is empty is not started. Never in git.
      - key: GITHUB_TOKEN
        sync: false
      - key: NOTION_TOKEN
        sync: false
      - key: SLACK_USER_TOKEN
        sync: false
      - key: GMAIL_ADDRESS
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
