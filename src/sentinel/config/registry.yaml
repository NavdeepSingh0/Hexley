    destination_kind: page

  # ---- connector preset: mail (mcp-mail-server 2.1.2, from its README; plan F2, D-054) ---------------------------------
  # Anyone can send a mail, so everything read from a mailbox is untrusted (R7, R8); a mailbox is private, so it is restricted
  # with every value fingerprinted (R2). Deliberately NOT listed, so no slip can allow them: reply_to_email and
  # continue_email_thread take no recipient (the recipient comes from a mail an attacker can write, so R1 would have nothing
  # to check; use send_email), delete and move, and save_attachment.
  gmail__check_connection:
