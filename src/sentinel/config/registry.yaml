# Tool registry: the ONLY source of labels (invariant 6). Unknown tools get `default` below.
registry_version: 1

# Applied to any tool or result not listed here: untrusted, restricted, consequential, outbound.
default:
  capability: send
  resource_class: unknown
  outbound: true
  consequential: true
  output_integrity: untrusted
  output_confidentiality: restricted

tools:
  read_quotation:
    capability: read
    resource_class: quotation_doc
    outbound: false
    consequential: false
    output_integrity: untrusted       # vendor-authored document: untrusted by definition
    output_confidentiality: internal

  query_stock:
    capability: read
    resource_class: stock_register
    outbound: false
    consequential: false
    output_integrity: trusted
    output_confidentiality: restricted   # shown as SECRET
    fingerprint_fields: [quantity, depot_code, dispatch_date]

  send_email:
    capability: send
    resource_class: email_external
    outbound: true
    consequential: true
    output_integrity: trusted
    output_confidentiality: internal
    destination_args: [to]

  # Implemented inside the gateway (hardened mode): the agent supplies only the quotation id; Sentinel renders
  # the message and chooses the recipient. No destination_args: the agent has no say in where it goes.
  send_quote_ack:
    capability: send
    resource_class: email_external
    outbound: true
    consequential: true
    local: true
    egress_template: quote_ack_v1
    output_integrity: trusted
    output_confidentiality: internal

  # ---- the general-purpose tools (core plan B3). Mock and sandboxed; labels follow docs/DECISIONS.md D-037. ----
  list_documents:
    capability: read
    resource_class: document_index
    outbound: false
    consequential: false
    output_integrity: untrusted       # file names are chosen by whoever put the files there
    output_confidentiality: internal

  read_document:
    capability: read
    resource_class: document
    outbound: false
    consequential: false
    output_integrity: untrusted       # a document can carry hidden instructions: reading one taints the session (R7)
    output_confidentiality: internal

  query_db:
    capability: read
    resource_class: customer_database
    outbound: false
    consequential: false
    output_integrity: trusted
    output_confidentiality: restricted   # customers and salaries: shown as SECRET
    fingerprint_fields: [all]

  fetch_url:
    capability: read
    resource_class: web
    outbound: true                    # a web address can carry data out in its query string, so it is checked like a send
    consequential: true
    output_integrity: untrusted
    output_confidentiality: internal
    destination_args: [url]
    destination_kind: url

  http_post:
    capability: send
    resource_class: web_post
    outbound: true
    consequential: true
    output_integrity: trusted
    output_confidentiality: internal
    destination_args: [url]
    destination_kind: url

  write_file:
    capability: write
    resource_class: file
    outbound: true                    # writing data to a place others can read is data leaving
    consequential: true
    output_integrity: trusted
    output_confidentiality: internal
    destination_args: [path]
    destination_kind: path

  run_command:
    capability: write
    resource_class: shell
    outbound: false
    consequential: true
    requires_human_verification: true  # R4: a person confirms every command (this demo never runs one)
    output_integrity: trusted
    output_confidentiality: internal

  # ---- tools a coding client has built in (plan F1). A client's own hook reports them under these names, with the client's
  # own argument names (command, file_path, url); effects.py reads those, so a protected path or a destructive command is
  # caught whichever tool carries it. Bash output may hold anything (a file, a page), so it taints the session; a command or a
  # file edit is not itself held after that, because the dangerous ones are caught by what they do (R1, R4 effects).
  Bash:
    capability: write
    resource_class: shell
    outbound: false
    consequential: false
    output_integrity: untrusted
    output_confidentiality: internal

  Write:
    capability: write
    resource_class: file
    outbound: false
    consequential: false
    output_integrity: trusted
    output_confidentiality: internal

  Edit:
    capability: write
    resource_class: file
    outbound: false
    consequential: false
    output_integrity: trusted
    output_confidentiality: internal

  WebFetch:
    capability: read
    resource_class: web
    outbound: true                    # like fetch_url: a web address can carry data out in its query string
    consequential: true
    output_integrity: untrusted
    output_confidentiality: internal
    destination_args: [url]
    destination_kind: url

  update_vendor_bank:
    capability: write
    resource_class: vendor_bank_details
    outbound: false
    consequential: true
    requires_human_verification: true   # R4: a person confirms every change to where money goes
    output_integrity: trusted
    output_confidentiality: internal

  # ---- connector preset: GitHub (official MCP server v2.0.3, toolsets repos and issues; plan F2, D-052) ----------------
  # Tool names are github__<tool>. Anything an issue or a file says may have been written by an outsider, so every read is
  # untrusted (R7, R8). A file may come from a private repository, so file reads are restricted and every value in them is
  # fingerprinted (R2). Every write names its repository (owner + repo): the slip lists the repositories by name (R1), and
  # the officer marks the private ones internal. Tools not listed here (create or fork a repository, collaborators, ...)
  # get the default labels and no slip can allow them. The token's own repository limit at GitHub is a second wall.
  github__issue_read:
    capability: read
    resource_class: github_issue
    outbound: false
    consequential: false
    output_integrity: untrusted       # anyone can open an issue or comment on a public repository
    output_confidentiality: internal

  github__list_issues:
    capability: read
    resource_class: github_issue
    outbound: false
    consequential: false
    output_integrity: untrusted
    output_confidentiality: internal

  github__search_issues:
    capability: read
    resource_class: github_issue
    outbound: false
    consequential: false
    output_integrity: untrusted
    output_confidentiality: internal
    free_text_args: [query]           # a search, not a statement

  github__get_file_contents:
    capability: read
    resource_class: github_code
    outbound: false
    consequential: false
    output_integrity: untrusted       # a contributor or a pull request can put instructions in a file
    output_confidentiality: restricted   # the file may be in a private repository
    fingerprint_fields: [all]

  github__list_commits:
    capability: read
    resource_class: github_code
    outbound: false
    consequential: false
    output_integrity: untrusted       # commit messages are written by contributors
    output_confidentiality: internal

  github__list_branches:
    capability: read
    resource_class: github_code
    outbound: false
    consequential: false
    output_integrity: trusted
    output_confidentiality: internal

  github__add_issue_comment:
    capability: send
    resource_class: github_issue
    outbound: true                    # a comment on a public repository is published to the world
    consequential: true
    output_integrity: trusted
    output_confidentiality: internal
    destination_args: [owner, repo]
    destination_kind: repo

  github__issue_write:
    capability: send
    resource_class: github_issue
    outbound: true
    consequential: true
    output_integrity: trusted
    output_confidentiality: internal
    destination_args: [owner, repo]
    destination_kind: repo

  github__create_or_update_file:
    capability: write
    resource_class: github_code
    outbound: true                    # writing to a repository is data leaving if the repository is public
    consequential: true
    output_integrity: trusted
    output_confidentiality: internal
    destination_args: [owner, repo]
    destination_kind: repo

  github__create_branch:
    capability: write
    resource_class: github_code
    outbound: true
    consequential: true
    output_integrity: trusted
    output_confidentiality: internal
    destination_args: [owner, repo]
    destination_kind: repo

  github__delete_file:
    capability: write
    resource_class: github_code
    outbound: true
    consequential: true
    requires_human_verification: true  # R4: a deletion waits for the officer
    output_integrity: trusted
    output_confidentiality: internal
    destination_args: [owner, repo]
    destination_kind: repo

  # ---- the same GitHub labels, for a client's hook (Antigravity's own GitHub server, D-059). A hook reports these names as
  # github.<tool>; a test holds the two lists to the same labels.
  github.issue_read:
    capability: read
    resource_class: github_issue
    outbound: false
    consequential: false
    output_integrity: untrusted       # anyone can open an issue or comment on a public repository
    output_confidentiality: internal

  github.list_issues:
    capability: read
    resource_class: github_issue
    outbound: false
    consequential: false
    output_integrity: untrusted
    output_confidentiality: internal

  github.search_issues:
    capability: read
    resource_class: github_issue
    outbound: false
    consequential: false
    output_integrity: untrusted
    output_confidentiality: internal
    free_text_args: [query]           # a search, not a statement

  github.get_file_contents:
    capability: read
    resource_class: github_code
    outbound: false
    consequential: false
    output_integrity: untrusted       # a contributor or a pull request can put instructions in a file
    output_confidentiality: restricted   # the file may be in a private repository
    fingerprint_fields: [all]

  github.list_commits:
    capability: read
    resource_class: github_code
    outbound: false
    consequential: false
    output_integrity: untrusted       # commit messages are written by contributors
    output_confidentiality: internal

  github.list_branches:
    capability: read
    resource_class: github_code
    outbound: false
    consequential: false
    output_integrity: trusted
    output_confidentiality: internal

  github.add_issue_comment:
    capability: send
    resource_class: github_issue
    outbound: true                    # a comment on a public repository is published to the world
    consequential: true
    output_integrity: trusted
    output_confidentiality: internal
    destination_args: [owner, repo]
    destination_kind: repo

  github.issue_write:
    capability: send
    resource_class: github_issue
    outbound: true
    consequential: true
    output_integrity: trusted
    output_confidentiality: internal
    destination_args: [owner, repo]
    destination_kind: repo

  github.create_or_update_file:
    capability: write
    resource_class: github_code
    outbound: true                    # writing to a repository is data leaving if the repository is public
    consequential: true
    output_integrity: trusted
    output_confidentiality: internal
    destination_args: [owner, repo]
    destination_kind: repo

  github.create_branch:
    capability: write
    resource_class: github_code
    outbound: true
    consequential: true
    output_integrity: trusted
    output_confidentiality: internal
    destination_args: [owner, repo]
    destination_kind: repo

  github.delete_file:
    capability: write
    resource_class: github_code
    outbound: true
    consequential: true
    requires_human_verification: true  # R4: a deletion waits for the officer
    output_integrity: trusted
    output_confidentiality: internal
    destination_args: [owner, repo]
    destination_kind: repo

  # ---- connector preset: Notion (official MCP server 2.6.1; plan F2, D-053) --------------------------------------------
  # Tool names are notion__API-<tool>. Whoever can edit a page can write instructions into it, so every read of content is
  # untrusted (R7, R8), and a workspace is private, so content is restricted with every value fingerprinted (R2). Every write
  # names its page: the slip lists pages by id (R1), and the officer marks private ones internal. A write to a block inside
  # an allowed page is refused, because Sentinel does not know the page tree: write to the page itself. Not listed, so no
  # slip can allow them: delete a block, move a page, change a database's structure, list the workspace's users.
  notion__API-get-self:
    capability: read
    resource_class: notion_account
    outbound: false
    consequential: false
    output_integrity: trusted
    output_confidentiality: internal

  notion__API-post-search:              # a read, though the server marks every POST as destructive
    capability: read
    resource_class: notion_page
    outbound: false
    consequential: false
    output_integrity: untrusted
    output_confidentiality: restricted
    free_text_args: [query]           # a search, not a statement
    fingerprint_fields: [all]

  notion__API-retrieve-a-page:
    capability: read
    resource_class: notion_page
    outbound: false
    consequential: false
    output_integrity: untrusted
    output_confidentiality: restricted
    fingerprint_fields: [all]

  notion__API-retrieve-page-markdown:
    capability: read
    resource_class: notion_page
    outbound: false
    consequential: false
    output_integrity: untrusted
    output_confidentiality: restricted
    fingerprint_fields: [all]

  notion__API-get-block-children:
    capability: read
    resource_class: notion_page
    outbound: false
    consequential: false
    output_integrity: untrusted
    output_confidentiality: restricted
    fingerprint_fields: [all]

  notion__API-retrieve-a-comment:
    capability: read
    resource_class: notion_page
    outbound: false
    consequential: false
    output_integrity: untrusted
    output_confidentiality: restricted
    fingerprint_fields: [all]

  notion__API-query-data-source:        # a read, though the server marks every POST as destructive
    capability: read
    resource_class: notion_database
    outbound: false
    consequential: false
    output_integrity: untrusted
    output_confidentiality: restricted
    fingerprint_fields: [all]

  notion__API-retrieve-a-data-source:
    capability: read
    resource_class: notion_database
    outbound: false
    consequential: false
    output_integrity: untrusted
    output_confidentiality: internal

  notion__API-retrieve-a-database:
    capability: read
    resource_class: notion_database
    outbound: false
    consequential: false
    output_integrity: untrusted
    output_confidentiality: internal

  notion__API-post-page:
    capability: write
    resource_class: notion_page
    outbound: true                    # a page others can read, possibly shared to the web
    consequential: true
    output_integrity: trusted
    output_confidentiality: internal
    destination_args: [parent.page_id]
    destination_kind: page

  notion__API-patch-block-children:     # append to a page
    capability: write
    resource_class: notion_page
    outbound: true
    consequential: true
    output_integrity: trusted
    output_confidentiality: internal
    destination_args: [block_id]
    destination_kind: page

  notion__API-create-a-comment:
    capability: send
    resource_class: notion_page
    outbound: true
    consequential: true
    output_integrity: trusted
    output_confidentiality: internal
    destination_args: [parent.page_id]
    destination_kind: page

  notion__API-patch-page:
    capability: write
    resource_class: notion_page
    outbound: true
    consequential: true
    requires_human_verification: true  # R4: this call can also put a page in the trash
    output_integrity: trusted
    output_confidentiality: internal
    destination_args: [page_id]
    destination_kind: page

  notion__API-update-page-markdown:
    capability: write
    resource_class: notion_page
    outbound: true
    consequential: true
    requires_human_verification: true  # R4: this call can replace a page's whole content
    output_integrity: trusted
    output_confidentiality: internal
    destination_args: [page_id]
    destination_kind: page

  # ---- Claude's own Gmail connector, judged and not hosted (plan F3, D-057) ---------------------------------------------
  # Names as a client reports them: `mcp__claude_ai_Gmail__send_message` or Gmail:send_message both read as gmail.send_message.
  # Everything read from a mailbox is untrusted (anyone can send a mail) and restricted. send_message is the only tool that
  # sends: its draftId sends a stored draft whatever the other arguments say, and its attachments are base64 that cannot be
  # read for restricted values, so both are refused. reply and forward are left off, because their recipients default to the
  # original mail's, which an attacker writes. Labels, trash, spam and drafts other than creating one are left off too.
  gmail.search_threads:
    capability: read
    resource_class: mail_message
    outbound: false
    consequential: false
    output_integrity: untrusted
    output_confidentiality: restricted
    free_text_args: [query]           # a search, not a statement
    fingerprint_fields: [all]

  gmail.get_thread:
    capability: read
    resource_class: mail_message
    outbound: false
    consequential: false
    output_integrity: untrusted
    output_confidentiality: restricted
    fingerprint_fields: [all]

  gmail.get_message:
    capability: read
    resource_class: mail_message
    outbound: false
    consequential: false
    output_integrity: untrusted
    output_confidentiality: restricted
    fingerprint_fields: [all]

  gmail.create_draft:
    capability: write
    resource_class: mail_draft
    outbound: false                   # a draft stays in the account; sending one by its id is refused above
    consequential: false
    output_integrity: trusted
    output_confidentiality: internal

  gmail.send_message:
    capability: send
    resource_class: email_external
    outbound: true
    consequential: true
    output_integrity: trusted
    output_confidentiality: internal
    destination_args: [to]            # cc and bcc are destinations too (effects.extra_destination_args)
    unchecked_args: [draftId, attachments]

  # ---- Claude's own Slack connector, judged and not hosted (plan F3, D-057) ---------------------------------------------
  # Names read as slack.slack_send_message. Anyone in a workspace can write a message, so everything read from it is untrusted;
  # a workspace is private, so messages are restricted with every value fingerprinted. Every send names its channel or person by
  # id, and the slip lists them exactly. A stored draft is refused, because what it sends cannot be seen here. Left off, so no slip
  # can allow them: creating conversations, canvases, lists, reactions, file uploads and reading profiles.
  slack.slack_read_channel:
    capability: read
    resource_class: slack_message
    outbound: false
    consequential: false
    output_integrity: untrusted
    output_confidentiality: restricted
    fingerprint_fields: [all]

  slack.slack_read_thread:
    capability: read
    resource_class: slack_message
    outbound: false
    consequential: false
    output_integrity: untrusted
    output_confidentiality: restricted
    fingerprint_fields: [all]

  slack.slack_search_public:
    capability: read
    resource_class: slack_message
    outbound: false
    consequential: false
    output_integrity: untrusted
    output_confidentiality: restricted
    fingerprint_fields: [all]

  slack.slack_search_public_and_private:
    capability: read
    resource_class: slack_message
    outbound: false
    consequential: false
    output_integrity: untrusted
    output_confidentiality: restricted
    fingerprint_fields: [all]

  slack.slack_search_channels:
    capability: read
    resource_class: slack_channel
    outbound: false
    consequential: false
    output_integrity: untrusted
    output_confidentiality: internal

  slack.slack_list_user_channels:
    capability: read
    resource_class: slack_channel
    outbound: false
    consequential: false
    output_integrity: untrusted
    output_confidentiality: internal

  slack.slack_send_message_draft:
    capability: write
    resource_class: slack_draft
    outbound: false                   # a draft stays with the person; sending a stored draft by its id is refused
    consequential: false
    output_integrity: trusted
    output_confidentiality: internal

  slack.slack_send_message:
    capability: send
    resource_class: slack_message
    outbound: true
    consequential: true
    output_integrity: trusted
    output_confidentiality: internal
    destination_args: [channel_id]
    destination_kind: channel
    unchecked_args: [draft_id]

  slack.slack_schedule_message:
    capability: send
    resource_class: slack_message
    outbound: true
    consequential: true
    output_integrity: trusted
    output_confidentiality: internal
    destination_args: [channel_id]
    destination_kind: channel

  # ---- Claude's own Notion connector, judged and not hosted (plan F3, D-057) --------------------------------------------
