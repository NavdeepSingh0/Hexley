    resource_class: mail_account
    outbound: false
    consequential: false
    output_integrity: trusted
    output_confidentiality: internal

  gmail__list_mailboxes:
    capability: read
    resource_class: mail_account
    outbound: false
    consequential: false
    output_integrity: trusted
    output_confidentiality: internal

  gmail__search_messages:
    capability: read
    resource_class: mail_message
    outbound: false
    consequential: false
    output_integrity: untrusted
    output_confidentiality: restricted
    fingerprint_fields: [all]

  gmail__find_unreplied_messages:
    capability: read
    resource_class: mail_message
    outbound: false
    consequential: false
    output_integrity: untrusted
    output_confidentiality: restricted
    fingerprint_fields: [all]

  gmail__get_message:
    capability: read
    resource_class: mail_message
    outbound: false
    consequential: false
    output_integrity: untrusted
    output_confidentiality: restricted
    fingerprint_fields: [all]

  gmail__get_messages:
    capability: read
    resource_class: mail_message
    outbound: false
    consequential: false
    output_integrity: untrusted
    output_confidentiality: restricted
    fingerprint_fields: [all]

  gmail__send_email:
    capability: send
    resource_class: email_external
    outbound: true
    consequential: true
    output_integrity: trusted
    output_confidentiality: internal
    destination_args: [to]            # cc and bcc are destinations too (effects.extra_destination_args)
