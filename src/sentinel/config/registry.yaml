# Tool registry: the ONLY source of labels (invariant 6). Unknown tools get `default` below.
registry_version: 1

# Applied to any tool or result not listed here: untrusted, restricted, consequential, outbound.
default:
  capability: send
  resource_class: unknown
  outbound: true
  consequential: true
  output_integrity: untrusted
  output_confidentiality: restricted

tools:
  read_quotation:
    capability: read
    resource_class: quotation_doc
    outbound: false
    consequential: false
    output_integrity: untrusted       # vendor-authored document: untrusted by definition
    output_confidentiality: internal

  query_stock:
    capability: read
    resource_class: stock_register
    outbound: false
    consequential: false
    output_integrity: trusted
    output_confidentiality: restricted   # shown as SECRET
    fingerprint_fields: [quantity, depot_code, dispatch_date]

  send_email:
    capability: send
    resource_class: email_external
    outbound: true
    consequential: true
    output_integrity: trusted
    output_confidentiality: internal
    destination_args: [to]

  # Implemented inside the gateway (hardened mode): the agent supplies only the quotation id; Sentinel renders
  # the message and chooses the recipient. No destination_args: the agent has no say in where it goes.
  send_quote_ack:
    capability: send
    resource_class: email_external
    outbound: true
    consequential: true
    local: true
    egress_template: quote_ack_v1
    output_integrity: trusted
    output_confidentiality: internal

  # ---- the general-purpose tools (core plan B3). Mock and sandboxed; labels follow docs/DECISIONS.md D-037. ----
  list_documents:
    capability: read
    resource_class: document_index
    outbound: false
    consequential: false
    output_integrity: untrusted       # file names are chosen by whoever put the files there
    output_confidentiality: internal

  read_document:
    capability: read
    resource_class: document
    outbound: false
    consequential: false
    output_integrity: untrusted       # a document can carry hidden instructions: reading one taints the session (R7)
    output_confidentiality: internal

  query_db:
    capability: read
    resource_class: customer_database
    outbound: false
    consequential: false
    output_integrity: trusted
    output_confidentiality: restricted   # customers and salaries: shown as SECRET
    fingerprint_fields: [all]

  fetch_url:
    capability: read
    resource_class: web
    outbound: true                    # a web address can carry data out in its query string, so it is checked like a send
    consequential: true
    output_integrity: untrusted
    output_confidentiality: internal
    destination_args: [url]
    destination_kind: url

  http_post:
    capability: send
    resource_class: web_post
    outbound: true
    consequential: true
    output_integrity: trusted
    output_confidentiality: internal
    destination_args: [url]
    destination_kind: url

  write_file:
    capability: write
    resource_class: file
    outbound: true                    # writing data to a place others can read is data leaving
    consequential: true
    output_integrity: trusted
    output_confidentiality: internal
    destination_args: [path]
    destination_kind: path

  run_command:
    capability: write
    resource_class: shell
    outbound: false
    consequential: true
    requires_human_verification: true  # R4: a person confirms every command (this demo never runs one)
    output_integrity: trusted
    output_confidentiality: internal

  # ---- tools a coding client has built in (plan F1). A client's own hook reports them under these names, with the client's
  # own argument names (command, file_path, url); effects.py reads those, so a protected path or a destructive command is
  # caught whichever tool carries it. Bash output may hold anything (a file, a page), so it taints the session; a command or a
  # file edit is not itself held after that, because the dangerous ones are caught by what they do (R1, R4 effects).
  Bash:
    capability: write
    resource_class: shell
    outbound: false
    consequential: false
    output_integrity: untrusted
    output_confidentiality: internal

  Write:
    capability: write
    resource_class: file
    outbound: false
    consequential: false
    output_integrity: trusted
    output_confidentiality: internal

  Edit:
    capability: write
    resource_class: file
    outbound: false
    consequential: false
    output_integrity: trusted
    output_confidentiality: internal

  WebFetch:
    capability: read
    resource_class: web
    outbound: true                    # like fetch_url: a web address can carry data out in its query string
    consequential: true
    output_integrity: untrusted
    output_confidentiality: internal
    destination_args: [url]
    destination_kind: url

  update_vendor_bank:
    capability: write
    resource_class: vendor_bank_details
    outbound: false
    consequential: true
    requires_human_verification: true   # R4: a person confirms every change to where money goes
    output_integrity: trusted
    output_confidentiality: internal
